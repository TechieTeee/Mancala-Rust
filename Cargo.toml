[package]
name = "mancala_game"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mancala_game"
path = "src/main.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[dependencies]
yew = { version = "0.21.0", features = ["csr"] }
wasm-bindgen = "0.2.92"
web-sys = "0.3.69"
wasm-logger = "0.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yew-router = "0.18.0"

[dependencies.tokio]
version = "1"
features = ["macros", "rt-multi-thread"]

[dependencies.warp]
version = "0.3"